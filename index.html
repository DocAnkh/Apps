<style>

.canvas-wrap{position:relative;height:clamp(410px,66vh,750px);min-height:335px;overflow:hidden;background:#0e1422;touch-action:manipulation}.canvas-wrap:after{content:"";pointer-events:none;position:absolute;inset:0;box-shadow:inset 0 0 55px #050a17a6}canvas{display:block;width:100%;height:100%;touch-action:manipulation}.hint{position:absolute;bottom:11px;left:50%;transform:translateX(-50%);white-space:normal;text-align:center;max-width:calc(100% - 22px);font-size:11px;color:#e4eaf4ae;pointer-events:none;background:#0e15259e;border:1px solid #ffffff1a;padding:6px 10px;border-radius:50px}
.board-actions{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:12px}.rush{width:100%;background:linear-gradient(110deg,#5c5ce8,#9468ec);border:0;color:#fff;padding:15px;border-radius:11px;font-weight:850;letter-spacing:.03em;box-shadow:0 7px 25px #6655da35;user-select:none;-webkit-user-select:none}.rush.active{background:linear-gradient(110deg,#2fc9c4,#725be8)}.speed-label{font-size:11px;color:var(--muted);text-align:right;min-width:70px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.metric{text-align:center;padding:12px 6px;border-right:1px solid var(--line)}.metric:last-child{border-right:0}.metric b{display:block;font-size:15px;font-variant-numeric:tabular-nums}.metric span{color:var(--muted);font-size:10px;letter-spacing:.04em;text-transform:uppercase}
.tabs{display:flex;padding:6px;gap:3px;border-bottom:1px solid var(--line)}.tab{flex:1;min-width:0;padding:11px 3px;border:0;border-radius:10px;color:#a8b0c9;background:none;font-size:11px;font-weight:750}.tab[aria-selected="true"]{background:#30304e;color:#f4efff;box-shadow:inset 0 0 0 1px #69608e}.tab:hover:not([aria-selected="true"]){background:#23283b}.tab-content{padding:15px;min-height:410px}.section-title{margin:2px 0 4px;font-size:17px;font-weight:850;letter-spacing:-.02em}.section-sub{color:var(--muted);font-size:12px;margin:0 0 17px}.tier{border:1px solid #363a53;background:#1c2031;border-radius:13px;padding:12px;margin-bottom:10px}.tier-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.tier-name{display:flex;align-items:center;gap:10px}.spark-emblem{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#111725}.spark-emblem svg{width:22px;height:22px}.tier-info strong{display:block;font-size:13px}.tier-info small{color:var(--muted);font-size:11px}.tier-count{text-align:right;font-size:20px;font-weight:850;color:#e8e9fb}.tier-count small{display:block;font-size:10px;font-weight:500;color:var(--muted)}.buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.btn{border:1px solid #54557b;background:#34395e;color:#ecefff;border-radius:9px;padding:10px 4px;font-size:11px;min-height:44px;font-weight:750}.btn b{display:block;font-size:12px}.btn.primary{background:#3d60d8;border-color:#6082e8;color:white}.btn.gold{background:#473a39;border-color:#6d5945;color:#ffdd9d}.btn:hover:not(:disabled){filter:brightness(1.17)}.upgrade{display:flex;align-items:center;gap:10px;margin-bottom:10px;background:#1c2031;border:1px solid #353a52;border-radius:12px;padding:13px}.upgrade-symbol{display:grid;place-items:center;min-width:38px;height:38px;border-radius:10px;background:#292e48;font-size:19px}.upgrade-body{flex:1;min-width:0}.upgrade-body strong{display:block;font-size:13px}.upgrade-body small{display:block;color:var(--muted);font-size:11px}.upgrade button{min-width:90px;max-width:110px}.pill{display:inline-block;border-radius:100px;border:1px solid #3b4a57;color:#89ded6;background:#173139;font-size:10px;font-weight:800;letter-spacing:.08em;padding:4px 8px}.milestone{text-align:center;padding:28px 15px;border-radius:14px;border:1px solid #373653;background:radial-gradient(circle at top,#332b58,#171b2c 70%)}.milestone-icon{font-size:42px;margin-bottom:12px}.milestone h3{margin:6px 0;font-size:20px}.milestone p{color:#b7b6cb;font-size:12px;line-height:1.65}.milestone .btn{width:100%;padding:15px;font-size:14px}.power-tray{display:none;gap:6px;grid-template-columns:repeat(4,minmax(0,1fr));padding:8px 12px;border-top:1px solid var(--line);background:#111726}.power-tray.visible{display:grid}.power-quick{display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;border-radius:9px;border:1px solid #505a80;background:#293654;color:#f0f4ff;font:700 11px/1.3 system-ui,sans-serif;min-height:47px;padding:6px 1px}.power-quick:disabled{opacity:.48}.power-quick .symbol{font-size:15px}.power-quick .status{font-size:9px;opacity:.8}.power-hud{display:none;flex-wrap:wrap;gap:6px;padding:8px 12px;background:#111728;border-bottom:1px solid #303549}.power-hud.has-powers{display:flex}.power-chip{font-size:10px;font-weight:800;letter-spacing:.02em;border:1px solid #657196;padding:5px 8px;border-radius:7px;color:#deecff;background:#28314c}.power-chip.gold{background:#4b3b22;color:#ffe0a0;border-color:#8e6b3a}.power-chip.pink{background:#47263c;color:#ffd0eb;border-color:#87506d}.power-chip.cyan{background:#1b4650;color:#aff6ff;border-color:#438b97}.power-chip.limited{background:#30244c;color:#f0d8ff;border-color:#8960c0}.limited-card{border:1px solid #5e4c77;border-radius:13px;background:linear-gradient(120deg,#29213f,#1a2a39);padding:14px;margin-top:13px}.limited-card strong{display:block;font-size:14px;margin-bottom:5px}.limited-card p{margin:0 0 8px;color:#c2bdd6;font-size:12px;line-height:1.5}.limited-row{display:flex;flex-wrap:wrap;gap:7px}.limited-pill{font-size:11px;color:#ddd4ed;border:1px solid #655678;background:#221f36;border-radius:9px;padding:7px 9px}.power-card{margin-bottom:11px;padding:13px;background:#1c2031;border:1px solid #353a52;border-radius:13px}.power-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}.power-orb{width:43px;height:43px;flex:0 0 43px;border-radius:13px;display:grid;place-items:center;font-size:23px;background:linear-gradient(135deg,#313355,#1c4e59)}.power-head h3{font-size:14px;line-height:1.3;margin:1px 0 3px}.power-head p{font-size:11px;line-height:1.4;color:#aeb6cc;margin:0}.power-level{margin-left:auto;color:#c1c6dc;font-size:11px;white-space:nowrap}.power-buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.power-btn{min-height:49px}.power-btn:disabled{opacity:.45}.note{font-size:11px;line-height:1.5;color:#8c97ad;padding:8px 4px}.foot{display:flex;gap:9px;align-items:center;justify-content:space-between;margin-top:14px;color:#7f88a4;font-size:11px}.toast{position:fixed;z-index:4;left:50%;top:24px;transform:translateX(-50%) translateY(-20px);border:1px solid #6f7194;border-radius:12px;background:#272b46;color:#fff;padding:11px 20px;box-shadow:0 14px 40px #0009;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;max-width:92vw;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:790px){.wrap{padding-top:12px}.layout{grid-template-columns:1fr}.canvas-wrap{height:clamp(400px,60svh,660px)}.tab-content{min-height:0}.top{margin-bottom:12px}.board-shell,.side{border-radius:15px}}@media(max-width:430px){.brand h1{font-size:20px}.bank{font-size:18px}.metrics{font-size:12px}.tier{padding:10px}.tab-content{padding:12px}.buttons{gap:5px}.btn{font-size:10px}.btn b{font-size:11px}}

<body>
<div class="wrap">
<header class="top"><div class="logo"><div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 1 30 16 16 31 2 16Z" fill="none" stroke="#9ef6ef" stroke-width="1.4"/><path d="M16 1 16 31M2 16h28M16 1 2 16l14 15 14-15Z" stroke="#a899ff" stroke-width="1" fill="none"/></svg></div><div class="brand"><div class="eyebrow">A little pocket universe · v1.0</div><h1>PRISM DRIFT</h1></div></div><button id="sound" class="small-btn" title="Toggle sound">♫ Off</button></header>
<main class="layout">
<section class="board-shell" aria-label="Game board"><div class="board-top"><div><div class="stage-name">CANVAS <span id="stage">01</span></div><div class="stage-line"><span class="stage-number" id="stage-title">First Light</span><span class="pill" id="prestige-tag">✦ 0 auras</span></div></div><div class="bank"><small>Prisms</small><span id="cash">0</span> ✧</div></div><div class="progress"><div id="bar"></div></div><div id="power-hud" class="power-hud" aria-live="off"></div><div class="canvas-wrap"><canvas id="field" aria-label="Floating sparks break a mosaic of colorful shards; tap the canvas to help them"></canvas><div class="hint" id="hint">Tap a shard to help break it ✧</div></div><div class="board-actions"><button id="rush" class="rush">HOLD FOR 3× SPEED</button><span id="speed-label" class="speed-label">Idle mode<br>is on</span></div><div id="power-tray" class="power-tray" aria-label="Quick access to unlocked power-ups"></div><div class="metrics"><div class="metric"><b id="spark-total">1</b><span>Active sparks</span></div><div class="metric"><b id="dps">0</b><span>Prisms / sec</span></div><div class="metric"><b id="broken">0 / 0</b><span>Shards broken</span></div></div></section>
<section class="side" aria-label="Upgrades and merging"><div class="tabs" role="tablist" aria-label="Game menus"><button class="tab" data-tab="sparks" role="tab" aria-selected="true">SPARKS</button><button class="tab" data-tab="upgrades" role="tab" aria-selected="false">UPGRADES</button><button class="tab" data-tab="powers" role="tab" aria-selected="false">POWERS</button><button class="tab" data-tab="ascend" role="tab" aria-selected="false">ASCEND</button></div><div class="tab-content" id="panel"></div></section>
</main>
<div class="foot"><span>Shards, damage & progress autosaved on this device · Play offline</span><button class="small-btn" id="reset">Reset game</button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='prism-drift-save-v1', MAX_TIERS=5, MAX_SPARKS=44;
const colors=['#7be9de','#d8a6fd','#f9d69d','#83adfd','#f7a9bf','#b8ed9d'];
const names=['First Light','Soft Orbit','Aurora Tide','Velvet Horizon','Crystal Bloom','Endless Morning'];
const tierNames=['Breeze','Glimmer','Nova','Comet','Supernova'];
const tierColors=['#8fd9ff','#9df1b8','#ffd996','#dca5ff','#ff91be'];
// Every spark can damage every shard. Shard levels scale with the canvas,
// with intentionally predictable difficulty milestones.
const shardLevelAtStage=stage=>Math.max(1,Math.round(stage<=10?1+(stage-1)/3:4+(stage-10)*.65));
// The most common shard level is always the canvas's target level.
function pickShardLevel(stage,roll=Math.random()){
 const core=shardLevelAtStage(stage);
 if(core===1)return 1;
 if(roll<.64)return core;
 if(roll<.86)return Math.max(1,core-1);
 if(roll<.96)return core+1;
 return Math.max(1,core-2);
}
// A level-1 shard needs at least four hits from an unupgraded Breeze spark.
// Exponential growth makes high-level shards genuinely durable.
const shardHealth=level=>Math.min(1e250,6.4*Math.pow(1.42,Math.min(700,Math.max(0,level-1))));

const $=id=>document.getElementById(id),
fmt=n=>{
 if(!Number.isFinite(n))return '∞';
 if(n===0)return '0';
 const v=Math.abs(n);
 if(v<1000){
  if(v<10)return Number(n.toFixed(2)).toLocaleString('en-US');
  if(v<100)return Number(n.toFixed(1)).toLocaleString('en-US');
  return Math.floor(n).toLocaleString('en-US');
 }
 const p=Math.min(Math.floor(Math.log10(v)/3),102);
 const suffix=['','K','M','B','T','Q'][p]||String.fromCharCode(97+Math.floor((p-6)/26))+String.fromCharCode(97+(p-6)%26);
 const scaled=n/Math.pow(1000,p);
 return Number(scaled.toFixed(scaled<10?2:scaled<100?1:0)).toLocaleString('en-US')+suffix;
},rng=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

const fresh=()=>({cash:45,earned:0,stage:1,tiers:[1,0,0,0,0],levels:[0,0,0,0,0],upgrades:{damage:0,speed:0,fortune:0,crit:0,bounty:0,recharge:0},powers:{},auras:0,ascensions:0,autoMerge:false,muted:true,board:null,savedAt:Date.now(),specialSparks:[],specialFinds:0});
let state=fresh();try{let raw=localStorage.getItem(KEY);if(raw){let obj=JSON.parse(raw);state={...fresh(),...obj,tiers:Array.isArray(obj.tiers)?obj.tiers.slice(0,MAX_TIERS):fresh().tiers,levels:Array.isArray(obj.levels)?obj.levels.slice(0,MAX_TIERS):fresh().levels,upgrades:{...fresh().upgrades,...(obj.upgrades||{})},powers:obj.powers&&typeof obj.powers==='object'&&!Array.isArray(obj.powers)?obj.powers:{}}}}catch(e){}
for(let i=0;i<MAX_TIERS;i++){state.tiers[i]=clamp(Math.floor(Number(state.tiers[i])||0),0,MAX_SPARKS);state.levels[i]=clamp(Math.floor(Number(state.levels[i])||0),0,100000)}
state.stage=clamp(Math.floor(Number(state.stage)||1),1,1e6);state.cash=Math.max(0,Number(state.cash)||0);state.earned=Math.max(0,Number(state.earned)||0);state.auras=Math.max(0,Math.floor(Number(state.auras)||0));state.ascensions=Math.max(0,Math.floor(Number(state.ascensions)||0));
for(const id of ['damage','speed','fortune','crit','bounty','recharge'])state.upgrades[id]=clamp(Math.floor(Number(state.upgrades[id])||0),0,200);
// Restore power levels and cooldown timestamps from old or new saves safely.
for(const id of ['overcharge','gold','chain','pulse']){
 const p=state.powers[id]&&typeof state.powers[id]==='object'?state.powers[id]:{};
 state.powers[id]={level:clamp(Math.floor(Number(p.level)||0),0,5),activeUntil:clamp(Number(p.activeUntil)||0,0,Date.now()+3600000),cooldownUntil:clamp(Number(p.cooldownUntil)||0,0,Date.now()+3600000)};
}
// Limited editions are temporary, separate from regular spark purchases/merges.
// An absolute expiration timestamp means reloading, tab suspension and 3× rush
// never extend the stated 3-minute lifetime.
const LIMITED_DEFS={
 ember:{name:'Ember',symbol:'🔥',color:'#ff8c68',damage:9,speed:1.35,earn:1},
 gilded:{name:'Gilded',symbol:'✧',color:'#ffdc76',damage:5,speed:1.15,earn:3},
 singularity:{name:'Singularity',symbol:'✴',color:'#b894ff',damage:22,speed:1.2,earn:1}
};
const LIMITED_TIME=180000,MAX_LIMITED=3,LIMITED_CHANCE=.01;
const nowAtLoad=Date.now();
state.specialFinds=Math.max(0,Math.floor(Number(state.specialFinds)||0));
state.specialSparks=(Array.isArray(state.specialSparks)?state.specialSparks:[]).filter(s=>
 s&&Object.hasOwn(LIMITED_DEFS,s.special)&&Number.isFinite(s.x)&&Number.isFinite(s.y)&&
 Number.isFinite(s.vx)&&Number.isFinite(s.vy)&&Number.isFinite(s.expiresAt)&&
 s.expiresAt>nowAtLoad&&s.expiresAt<=nowAtLoad+LIMITED_TIME
).slice(0,MAX_LIMITED).map(s=>({...s,tier:0,path:[],spin:0,noShardFor:0}));
const canvas=$('field'),ctx=canvas.getContext('2d',{alpha:false});let W=360,H=480,dpr=1,sparks=[],specialSparks=state.specialSparks,shards=[],particles=[],damagePopups=[],backgroundStars=[],dead=0,total=0,queueStage=false,gameTime=0,tab='sparks',rush=false,lastFrame=0,lastUI=0,lastPanel=0,lastSave=0,recentGains=0,recentTimer=0,lastDps=0,lastTap=0,toastHandle=0,audio=null,inspected=null,spawnSites=[];
const totalSparks=()=>state.tiers.reduce((a,b)=>a+b,0),bestTier=()=>{for(let i=MAX_TIERS-1;i>=0;i--)if(state.tiers[i]>0)return i;return 0},tierPower=i=>(1.6*Math.pow(3.4,i))*(1+state.levels[i]*.38)*(1+state.upgrades.damage*.28)*(1+state.auras*.18),sparkVelocity=i=>100*(1+state.upgrades.speed*.18)*(1+i*.07),fortune=()=>1+state.upgrades.fortune*.24+state.auras*.14;
const buyCost=i=>Math.floor(20*Math.pow(6.2,i)*Math.pow(1.33,state.tiers[i])*Math.pow(1.11,state.stage>1?Math.min(state.stage-1,10):0));
const levelCost=i=>Math.floor(20*Math.pow(5.3,i)*Math.pow(1.43,state.levels[i]));
const upgradeCost=id=>Math.floor(({damage:90,speed:85,fortune:100,crit:190,bounty:260,recharge:360})[id]*Math.pow(1.78,state.upgrades[id]));
// An unlocked power can be activated free, then recharged by playing/waiting.
// Wall-clock deadlines prevent refresh/reload from resetting its cooldown.
const POWER_DEFS={
 overcharge:{name:'Overcharge',symbol:'⚡',unlock:90,cooldown:52,duration:18,kind:'cyan'},
 gold:{name:'Golden Rush',symbol:'✧',unlock:280,cooldown:78,duration:24,kind:'gold'},
 chain:{name:'Chain Reaction',symbol:'✦',unlock:640,cooldown:85,duration:20,kind:'pink'},
 pulse:{name:'Prism Pulse',symbol:'◈',unlock:1100,cooldown:105,duration:0,kind:'cyan'}
};
const powerState=id=>state.powers[id],powerActive=(id,now=Date.now())=>powerState(id).level>0&&powerState(id).activeUntil>now;
const powerDuration=id=>POWER_DEFS[id].duration+Math.max(0,powerState(id).level-1)*4;
const powerCooldown=id=>Math.max(15,POWER_DEFS[id].cooldown*(1-Math.min(.52,(state.upgrades.recharge||0)*.06)));
const powerUpgradeCost=id=>Math.floor(POWER_DEFS[id].unlock*Math.pow(3.6,Math.max(1,powerState(id).level)));
const powerDescription=id=>{
 const lv=Math.max(1,powerState(id).level);
 if(id==='overcharge')return `×${(3+(lv-1)*.75).toFixed(lv===1?0:2)} spark damage for ${powerDuration(id)}s`;
 if(id==='gold')return `×${(3+(lv-1)*.5).toFixed(lv===1?0:1)} all earnings for ${powerDuration(id)}s`;
 if(id==='chain')return `Shattered shards splash ${Math.round((.18+.05*(lv-1))*100)}% HP to nearby shards for ${powerDuration(id)}s`;
 return `Instantly damages every remaining shard for ${Math.round((.07+.025*(lv-1))*1000)/10}% of its max HP`;
};

const mergeNeed=2;
function renderPanel(){let html='';if(tab==='sparks'){
 html='<h2 class="section-title">Build your constellation</h2><p class="section-sub">Buy and merge sparks for more damage. Every spark can damage any shard; tougher shards simply take more hits.</p>';
 const active=totalSparks();for(let i=0;i<MAX_TIERS;i++){let owned=state.tiers[i],prior=i===0||state.tiers.slice(i).some(n=>n>0)||state.levels[i]>0||state.earned>200*Math.pow(6,i);if(!prior)continue;let buy=buyCost(i),level=levelCost(i),canBuy=state.cash>=buy&&active<MAX_SPARKS,canLevel=state.cash>=level&&owned>0,canMerge=owned>=mergeNeed&&i<MAX_TIERS-1;

function repairSixPocketSave(oldSites){

// Swept intersections prevent high-speed sparks from tunneling through triangles.
function traceImpact(s,dx,dy){

function pointInTriangle(px,py,t){const s=(a,b,c)=>(px-c[0])*(a[1]-c[1])-(a[0]-c[0])*(py-c[1]);let a=s(t.a,t.b,t.c),b=s(t.b,t.c,t.a),c=s(t.c,t.a,t.b);return (a>=0&&b>=0&&c>=0)||(a<=0&&b<=0&&c<=0)}

function ping(){if(state.muted)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();if(Math.random()>.065)return;let osc=audio.createOscillator(),gain=audio.createGain(),now=audio.currentTime;osc.type='sine';osc.frequency.setValueAtTime(rng(450,850),now);osc.frequency.exponentialRampToValueAtTime(rng(270,470),now+.07);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.018,now+.012);gain.gain.exponentialRampToValueAtTime(.0001,now+.095);osc.connect(gain).connect(audio.destination);osc.start(now);osc.stop(now+.1)}catch(e){}}
function spawnLimitedSpark(t){
 if(specialSparks.length>=MAX_LIMITED||Math.random()>=LIMITED_CHANCE)return;
 const roll=Math.random(),key=roll<.65?'ember':roll<.93?'gilded':'singularity';
 const def=LIMITED_DEFS[key],heading=rng(0,Math.PI*2),speed=sparkVelocity(bestTier())*def.speed;
 const spark={x:clamp(t.x,8,W-8),y:clamp(t.y,8,H-8),vx:Math.cos(heading)*speed,vy:Math.sin(heading)*speed,
  tier:0,special:key,expiresAt:Date.now()+LIMITED_TIME,path:[],spin:0,noShardFor:0};
 specialSparks.push(spark);state.specialSparks=specialSparks;state.specialFinds++;
 for(let i=0;i<25;i++){const a=rng(0,Math.PI*2),v=rng(45,185);particles.push({x:t.x,y:t.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rng(.4,.95),maxLife:.95,color:def.color,r:rng(1.5,4)})}
 announce(def.symbol+' Rare '+def.name+' spark! 3:00 remaining');
 save();
}
function hitShard(t,damage,sparkTier,fromSplash=false,earnMultiplier=1){
 if(!t.alive)return false;
 const crit=!fromSplash&&Math.random()<Math.min(.6,(state.upgrades.crit||0)*.04);
 const dealt=Math.min(Math.max(0,damage*(crit?2:1)),t.hp);
 // Pay for actual shard HP removed, not for excess one-shot damage.
 // This keeps level-30 rewards meaningful without rewarding overkill exploits.
 const goldMult=powerActive('gold')?3+(powerState('gold').level-1)*.5:1;
 const reward=dealt*(.65+t.level*.13)*fortune()*(1+sparkTier*.12)*goldMult*earnMultiplier;
 state.cash+=reward;state.earned+=reward;recentGains+=reward;
 t.hp=Math.max(0,t.hp-dealt);t.flash=.12;
 if(damagePopups.length<28&&Math.random()<.45)damagePopups.push({x:t.x+rng(-11,11),y:t.y+rng(-8,8),value:(crit?'CRIT ':'')+fmt(dealt),life:.62,maxLife:.62});
 if(t.hp<=0){
  t.alive=false;dead++;
  let bonus=(1.7+state.stage*.34)*fortune()*(1+(state.upgrades.bounty||0)*.15)*goldMult*earnMultiplier;
  state.cash+=bonus;state.earned+=bonus;recentGains+=bonus;
  particleBurst(t,9);ping();
  spawnLimitedSpark(t);
  if(powerActive('chain')&&!fromSplash){
   // A single layer of splash damage: splash kills do NOT recurse infinitely.
   const lv=powerState('chain').level;
   const near=shards.filter(u=>u.alive&&u!==t&&Math.hypot(u.x-t.x,u.y-t.y)<100).sort((a,b)=>Math.hypot(a.x-t.x,a.y-t.y)-Math.hypot(b.x-t.x,b.y-t.y)).slice(0,lv>=3?3:2);
   for(const u of near){hitShard(u,u.maxHp*(.18+.05*(lv-1)),sparkTier,true,earnMultiplier);particleBurst(u,3)}
  }
  if(dead>=total)queueStage=true;
 }else if(Math.random()<.25)particleBurst(t,2);
 return true;
}
function nearestAlive(x,y){let chosen=null,d=Infinity;
 for(const t of shards)if(t.alive){let v=(t.x-x)**2+(t.y-y)**2;if(v<d){d=v;chosen=t}}
 return chosen;
}

function activatePower(id){
 if(!Object.hasOwn(POWER_DEFS,id))return false;
 const p=powerState(id),def=POWER_DEFS[id],now=Date.now();
 if(p.level<=0||p.cooldownUntil>now||p.activeUntil>now)return false;
 if(id==='pulse'&&dead>=total)return false;
 p.cooldownUntil=now+Math.round(powerCooldown(id)*1000);
 if(def.duration)p.activeUntil=now+powerDuration(id)*1000;
 if(id==='pulse'){
  const amt=.07+.025*(p.level-1);
  let count=0;
  for(const t of shards)if(t.alive){hitShard(t,t.maxHp*amt,0,true);count++}
  announce('Prism Pulse! '+count+' shards struck ◈');
  // Whole-board pulses must not generate free health/money on reload.
 }else announce(def.name+' activated! '+powerDuration(id)+' seconds');
 save();return true;
}
function tick(dt){
 gameTime+=dt;
 const now=Date.now();
 if(specialSparks.some(s=>s.expiresAt<=now)){
  specialSparks=specialSparks.filter(s=>s.expiresAt>now);
  state.specialSparks=specialSparks;
 }

 const elapsed=dt*(rush?3:1);
 for(const s of [...sparks,...specialSparks]){
  // Fixed heading between impacts: NO steering or circular homing.
  const speed=s.special?sparkVelocity(bestTier())*LIMITED_DEFS[s.special].speed:sparkVelocity(s.tier),len=Math.hypot(s.vx,s.vy)||1;
  s.vx=s.vx/len*speed;s.vy=s.vy/len*speed;
  let steps=Math.max(1,Math.ceil(elapsed/.016)),slice=elapsed/steps;
  for(let k=0;k<steps;k++){
   let remaining=slice;
   for(let bounce=0;bounce<6&&remaining>1e-7;bounce++){
    const dx=s.vx*remaining,dy=s.vy*remaining;
    const impact=traceImpact(s,dx,dy);
    if(!impact){s.x+=dx;s.y+=dy;s.noShardFor=(s.noShardFor||0)+remaining;break}
    s.x+=dx*impact.time;s.y+=dy*impact.time;
    s.noShardFor=(s.noShardFor||0)+remaining*impact.time;
    // Record each contact point so the spark trail follows its true trajectory.
    s.path.push([s.x,s.y]);if(s.path.length>15)s.path.shift();
    if(impact.shard){
     hitShard(impact.shard,tierPower(s.special?bestTier():s.tier)*(s.special?LIMITED_DEFS[s.special].damage:1)*(powerActive('overcharge')?3+(powerState('overcharge').level-1)*.75:1),s.special?bestTier():s.tier,false,s.special?LIMITED_DEFS[s.special].earn:1);
     s.noShardFor=0; // ANY shard contact resets the anti-stall timer.
    }
    if(impact.shard&&!impact.shard.alive){
     // Killing blow: shard disappears, so fly THROUGH without changing heading.
     const len=Math.hypot(s.vx,s.vy)||1;
     s.x+=s.vx/len*.15;s.y+=s.vy/len*.15;
    }else if(!impact.shard&&s.noShardFor>=STALL_WALL_SECONDS){
     // After a prolonged empty flight, the NEXT wall bounce gets an inward,
     // randomized heading. Never randomize on shard collisions or in open air.
     const speed=Math.hypot(s.vx,s.vy)||1;
     const nx=impact.nx,ny=impact.ny,tx=-ny,ty=nx;
     const angle=(Math.random()<.5?-1:1)*rng(.25,1.08);
     s.vx=(nx*Math.cos(angle)+tx*Math.sin(angle))*speed;
     s.vy=(ny*Math.cos(angle)+ty*Math.sin(angle))*speed;
     s.noShardFor=0;
     s.x+=nx*.15;s.y+=ny*.15;
    }else{
     // Surviving shards and ordinary wall contacts use mirror reflection.
     const dot=s.vx*impact.nx+s.vy*impact.ny;
     s.vx-=2*dot*impact.nx;s.vy-=2*dot*impact.ny;
     s.x+=impact.nx*.15;s.y+=impact.ny*.15;
    }
    remaining*=1-impact.time;
   }
  }
  s.x=clamp(s.x,8,W-8);s.y=clamp(s.y,8,H-8);
  s.path.push([s.x,s.y]);if(s.path.length>15)s.path.shift();
  s.spin+=elapsed*3;
 }
 for(const t of shards)if(t.flash>0)t.flash=Math.max(0,t.flash-elapsed);
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*elapsed;p.y+=p.vy*elapsed;p.vx*=.985;p.vy*=.985;p.life-=elapsed;if(p.life<=0)particles.splice(i,1)}
 for(let i=damagePopups.length-1;i>=0;i--){const p=damagePopups[i];p.life-=elapsed;p.y-=20*elapsed;if(p.life<=0)damagePopups.splice(i,1)}
 if(queueStage){queueStage=false;const bonus=Math.floor(16*Math.pow(state.stage,1.42)*fortune());state.cash+=bonus;state.earned+=bonus;state.stage++;createStage();announce('Canvas cleared! +' +fmt(bonus)+' prisms ✧ · Next: Lv '+shardLevelAtStage(state.stage));save()}
 if(state.autoMerge){for(let i=0;i<MAX_TIERS-1;i++)if(state.tiers[i]>=2){state.tiers[i]-=2;state.tiers[i+1]++;syncSparks();renderPanel()}}
 recentTimer+=dt;if(recentTimer>=1){lastDps=recentGains/recentTimer;recentGains=0;recentTimer=0}
}
function draw(){ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#161a31');bg.addColorStop(.55,'#111c2c');bg.addColorStop(1,'#1b1830');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 for(const star of backgroundStars){ctx.globalAlpha=star.a;ctx.fillStyle='#deecff';ctx.beginPath();ctx.arc(star.x,star.y,star.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 for(const t of shards)if(t.alive){ctx.globalAlpha=t.alpha;ctx.beginPath();ctx.moveTo(t.a[0],t.a[1]);ctx.lineTo(t.b[0],t.b[1]);ctx.lineTo(t.c[0],t.c[1]);ctx.closePath();ctx.fillStyle=t.hue;ctx.fill();// Same subtle boundary for ALL shard levels; no coloured armour outlines or tier dots.
ctx.strokeStyle=t.flash>0?'#f3fcff':'#13182f';
ctx.lineWidth=1.1;
ctx.stroke();

if(t.hp<t.maxHp){ctx.globalAlpha=.26;ctx.strokeStyle='#f3fcff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.lineTo(t.b[0],t.b[1]);ctx.stroke()}}ctx.globalAlpha=1;
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.maxLife);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 ctx.textAlign='center';ctx.font='700 11px system-ui,sans-serif';for(const p of damagePopups){ctx.globalAlpha=Math.max(0,p.life/p.maxLife)*.9;ctx.fillStyle='#f4fbff';ctx.fillText('−'+p.value,p.x,p.y)}ctx.globalAlpha=1;
 for(const s of [...sparks,...specialSparks]){let color=s.special?LIMITED_DEFS[s.special].color:tierColors[s.tier];for(let i=1;i<s.path.length;i++){let a=s.path[i-1],b=s.path[i];ctx.globalAlpha=i/s.path.length*.32;ctx.strokeStyle=color;ctx.lineWidth=1+s.tier*.2;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}ctx.globalAlpha=1;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(Math.atan2(s.vy,s.vx)+Math.PI/2);ctx.shadowBlur=s.special?30:18;ctx.shadowColor=color;ctx.fillStyle=color;const r=s.special?9.5+Math.sin(gameTime*6+s.spin)*1.2:5.2+s.tier*1.5;ctx.beginPath();ctx.moveTo(0,-r*1.5);ctx.lineTo(-r,r);ctx.lineTo(0,r*.34);ctx.lineTo(r,r);ctx.closePath();ctx.fill();if(s.special){ctx.strokeStyle='#fff6e9';ctx.lineWidth=1.8;ctx.stroke();ctx.beginPath();ctx.arc(0,0,r*1.7,0,Math.PI*2);ctx.strokeStyle=color;ctx.globalAlpha=.5;ctx.lineWidth=1;ctx.stroke();}ctx.restore()}
}
function loop(time){if(!lastFrame)lastFrame=time;const dt=clamp((time-lastFrame)/1000,0,.05);lastFrame=time;tick(dt);draw();if(time-lastUI>220){updateLabels();lastUI=time}if(time-lastPanel>650){renderPanel();lastPanel=time}if(time-lastSave>2000){save();lastSave=time}requestAnimationFrame(loop)}
$('panel').addEventListener('click',e=>{let btn=e.target.closest('button[data-act]');if(!btn)return;let action=btn.dataset.act,i=Number(btn.dataset.tier),id=btn.dataset.id;let ok=false;if(action==='buy'){let c=buyCost(i);if(state.cash>=c&&totalSparks()<MAX_SPARKS){state.cash-=c;state.tiers[i]++;syncSparks();ok=true}}else if(action==='level'){let c=levelCost(i);if(state.tiers[i]>0&&state.cash>=c){state.cash-=c;state.levels[i]++;ok=true}}else if(action==='merge'){if(i<MAX_TIERS-1&&state.tiers[i]>=2){state.tiers[i]-=2;state.tiers[i+1]++;syncSparks();announce(tierNames[i+1]+' unlocked ✨');ok=true}}else if(action==='upgrade'){let c=upgradeCost(id);if(c&&state.cash>=c){state.cash-=c;state.upgrades[id]++;ok=true}}else if(action==='auto'){if(!state.autoMerge&&state.cash>=3500){state.cash-=3500;state.autoMerge=true;ok=true;announce('Auto Merge unlocked')}}else if(action==='unlock-power'){
 const def=POWER_DEFS[id],p=state.powers[id];if(def&&p&&p.level===0&&state.cash>=def.unlock){state.cash-=def.unlock;p.level=1;ok=true;announce(def.name+' unlocked!')}}else if(action==='upgrade-power'){
 const p=state.powers[id];if(POWER_DEFS[id]&&p&&p.level>=1&&p.level<5){let c=powerUpgradeCost(id);if(state.cash>=c){state.cash-=c;p.level++;ok=true;announce(POWER_DEFS[id].name+' Lv '+p.level)}}}else if(action==='activate-power'){
 if(activatePower(id))ok=true;
 }else if(action==='ascend'){let gain=Math.floor(Math.sqrt(Math.max(0,state.earned)/17000));if(state.stage>=5&&gain>0&&confirm('Ascend for +'+gain+' permanent auras? Your canvases, sparks and temporary upgrades will reset.')){let next=fresh();next.auras=state.auras+gain;next.ascensions=state.ascensions+1;next.autoMerge=state.autoMerge;next.muted=state.muted;
 // Power unlocks and their levels are permanent; clear active effects on prestige.
 next.powers=Object.fromEntries(Object.entries(state.powers).map(([id,p])=>[id,{level:p.level,activeUntil:0,cooldownUntil:p.cooldownUntil}]));
 state=next;sparks=[];specialSparks=state.specialSparks;syncSparks();createStage();ok=true;announce('A new dawn! +'+gain+' auras')}}if(ok){save();renderPanel();updateLabels()}});
$('power-tray').addEventListener('click',e=>{const btn=e.target.closest('button[data-power]');if(!btn)return;if(activatePower(btn.dataset.power)){renderPanel();updateLabels()}});
for(const b of document.querySelectorAll('.tab'))b.addEventListener('click',()=>{tab=b.dataset.tab;for(const t of document.querySelectorAll('.tab'))t.setAttribute('aria-selected',String(t===b));renderPanel()});
const setRush=on=>{rush=on;$('rush').classList.toggle('active',rush);$('rush').textContent=rush?'✦ 3× SPEED ACTIVE':'HOLD FOR 3× SPEED';updateLabels()};let rushBtn=$('rush');rushBtn.addEventListener('pointerdown',e=>{e.preventDefault();rushBtn.setPointerCapture?.(e.pointerId);setRush(true)});['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(a=>rushBtn.addEventListener(a,()=>setRush(false)));window.addEventListener('blur',()=>setRush(false));
canvas.addEventListener('pointerdown',e=>{let now=performance.now();if(now-lastTap<60)return;lastTap=now;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let target=null,best=65*65;for(const t of shards)if(t.alive){let d=(t.x-x)**2+(t.y-y)**2;if(d<best){best=d;target=t}}if(target){let tapTier=0;for(let i=0;i<MAX_TIERS;i++)if(state.tiers[i]>0)tapTier=i;hitShard(target,Math.max(1.5,tierPower(tapTier)*.35),tapTier);inspected={level:target.level,hp:target.hp,maxHp:target.maxHp,until:performance.now()+2600};particleBurst(target,4)}});
$('sound').addEventListener('click',()=>{state.muted=!state.muted;$('sound').textContent=state.muted?'♫ Off':'♫ On';save()});$('sound').textContent=state.muted?'♫ Off':'♫ On';
$('reset').addEventListener('click',()=>{if(!confirm('Reset all progress, including power-ups and permanent auras? This cannot be undone.'))return;state=fresh();sparks=[];specialSparks=state.specialSparks;syncSparks();createStage();save();renderPanel();updateLabels();announce('A fresh canvas awaits')});
const away=clamp((Date.now()-(Number(state.savedAt)||Date.now()))/1000,0,4*3600);if(away>20){const rate=state.tiers.reduce((v,n,i)=>v+n*tierPower(i)*1.15,0)*fortune();const offline=Math.floor(away*rate*.15);state.cash+=offline;state.earned+=offline;setTimeout(()=>announce('While you were away: +'+fmt(offline)+' prisms'),250)}
syncSparks();resize();renderPanel();updateLabels();if('ResizeObserver'in window)new ResizeObserver(resize).observe(canvas);window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else lastFrame=0});window.addEventListener('pagehide',save);requestAnimationFrame(loop);
})();
