<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocAnkh Apps</title>

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#121212;
    color:white;
    text-align:center;
}

header{
    background:#1f1f1f;
    padding:30px;
    font-size:36px;
    font-weight:bold;
}

p{
    color:#bbbbbb;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
    max-width:900px;
    margin:40px auto;
    padding:20px;
}

.card{
    background:#242424;
    border-radius:18px;
    padding:30px;
    transition:.25s;
    cursor:pointer;
    text-decoration:none;
    color:white;
}

.card:hover{
    transform:scale(1.05);
    background:#333333;
}

.icon{
    font-size:48px;
}

.title{
    font-size:22px;
    margin-top:15px;
}
</style>
</head>

<body>

<header>
🧰 DocAnkh Apps
<p>My personal collection of apps</p>
</header>

<div class="container">

<div class="card">
<div class="icon">♟️</div>
<div class="title">Chess</div>
</div>

<div class="card" href="dnd/">
<div class="icon">🎲</div>
<div class="title">D&D Tools</div>
</div>

<div class="card">
<div class="icon">🎨</div>
<div class="title">Image Tools</div>
</div>

<div class="card">
<div class="icon">🧮</div>
<div class="title">Utilities</div>
</div>

<a class="card" href="plumbing/">
  <div class="icon">🔧</div>
  <div class="title">Plumbing Toolbox</div>
</a>

</div>

</body>
</html>
