/* v1.5 Workshop: stable, large touch targets and clearer hierarchy */
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;appearance:none;-webkit-appearance:none}
.side{background:linear-gradient(165deg,#181c30,#111522)}
.shop-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:15px 16px 12px;background:linear-gradient(120deg,#20233a,#152538)}
.shop-heading-title{font-size:11px;color:#c8c6f1;letter-spacing:.15em;font-weight:900;white-space:nowrap}
.shop-wallet{font-size:10px;letter-spacing:.04em;font-weight:750;color:#a9b6d0;white-space:nowrap}
.shop-wallet strong{font-size:14px;color:#ffe2a1;font-variant-numeric:tabular-nums;margin:0 2px}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:8px;border-bottom:1px solid #343b54;background:#141a2b}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;padding:7px 1px;border:1px solid transparent;border-radius:12px;color:#a9b3ce;background:#1b2133;font-size:11px;font-weight:800;letter-spacing:.01em;transition:background .16s,border-color .16s,transform .12s}
.tab-icon{font-size:18px;font-weight:650;line-height:1;color:inherit}

.tab:active{transform:scale(.96);background:#43416c}
.tab:focus-visible,.btn:focus-visible,.power-quick:focus-visible{outline:2px solid #b0eff4;outline-offset:2px}
.tab-content{padding:16px;min-height:395px}
.section-title{font-size:19px;letter-spacing:-.035em;font-weight:850;margin:2px 0 5px}
.section-sub{font-size:12px;line-height:1.55;color:#aab7d2;margin-bottom:17px}
.tier,.upgrade,.elite-card,.power-card{background:linear-gradient(145deg,#20263a,#1b2031);border:1px solid #414961;border-radius:15px;box-shadow:0 4px 16px #04071224}
.tier{padding:14px;margin-bottom:12px}
.tier-name{min-width:0}.tier-info{min-width:0}.tier-info strong{font-size:15px;letter-spacing:-.01em}.tier-info small{font-size:11px;line-height:1.45;display:block;margin-top:4px}.tier-count{font-size:23px;color:#f1e4ff}
.spark-emblem{width:42px;height:42px;flex:0 0 42px;border-radius:12px;background:linear-gradient(140deg,#263e59,#262341)}
.buttons{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;padding:9px 6px;border-radius:11px;border:1px solid #5b6387;background:linear-gradient(155deg,#3c446a,#313855);color:#f2f4ff;font-size:11px;font-weight:850;letter-spacing:.025em;line-height:1.2;user-select:none;-webkit-user-select:none;transition:transform .1s ease,background .14s,border-color .14s,box-shadow .14s}
.btn b{font-size:12px;font-variant-numeric:tabular-nums;letter-spacing:0;color:#ffe2ac}
.btn.primary{background:linear-gradient(125deg,#4b69de,#6950c6);border-color:#8f92f4;box-shadow:0 4px 13px #5456d62b}
.btn.gold{background:linear-gradient(125deg,#514338,#453d46);border-color:#8c7358;color:#ffe6b0}
.btn:disabled{opacity:.42;filter:saturate(.55);box-shadow:none}
.btn:not(:disabled):active,.power-quick:not(:disabled):active{transform:scale(.96);filter:brightness(1.2);box-shadow:0 0 0 2px #a9b1ff50}
@media (hover:hover){.btn:not(:disabled):hover{filter:brightness(1.12);border-color:#a49df2}.tab:not([aria-selected="true"]):hover{background:#293249}}
.tier-heading{margin-bottom:14px;gap:8px}
.upgrade{padding:13px;gap:12px;margin-bottom:10px}.upgrade-body strong{font-size:13px}.upgrade-body small{font-size:11px;line-height:1.5;margin-top:4px}.upgrade button{min-width:96px;max-width:115px}
.elite-card,.power-card{padding:15px;margin-bottom:12px}.elite-title h3,.power-head h3{font-size:15px}.elite-title p,.power-head p{font-size:12px;line-height:1.45}.elite-detail{padding:12px 0;font-size:12px}
.elite-bottom{padding-top:12px}.elite-bottom button{min-width:130px}
.power-buttons{gap:9px}.power-btn{min-height:54px}
.limited-card{margin-top:15px;border-color:#615579;background:linear-gradient(135deg,#272443,#1d2e3a)}
.limited-card summary{cursor:pointer;color:#f5e4ff;font-weight:800;font-size:13px;min-height:24px;list-style:none;display:flex;justify-content:space-between;align-items:center}

.limited-card[open] summary::after{transform:rotate(180deg)}
.limited-card p{margin-top:10px}
.note{font-size:11px;line-height:1.6;color:#9aa7c0}
.milestone{border-radius:15px}.milestone .btn{min-height:54px}

@media(max-width:430px){.tab{font-size:12px;padding:8px 2px;min-height:47px}.tab-content{padding:12px}.btn{font-size:11px;min-height:51px;padding:10px 4px}.btn b{font-size:11px}.tier{padding:12px}.tier-info small{font-size:10px}.tier-count{font-size:21px}.upgrade{display:grid;grid-template-columns:40px minmax(0,1fr);grid-template-areas:'ico desc' 'action action';gap:8px 10px}.upgrade-symbol{grid-area:ico}.upgrade-body{grid-area:desc}.upgrade button{grid-area:action;width:100%;max-width:none;min-height:45px}.elite-bottom{flex-wrap:wrap}.elite-bottom button{width:100%}}
@media(prefers-reduced-motion:reduce){.btn,.tab,.limited-card summary::after{transition:none}}


/* v1.6: unified luminous spark glyphs and timed elite deployments */
.spark-art{display:block;flex:0 0 auto;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 4px currentColor)}
.spark-emblem{color:var(--spark-glow);box-shadow:inset 0 0 0 1px #ffffff12,0 0 22px color-mix(in srgb,var(--spark-glow) 18%,transparent)}
.spark-emblem .spark-art{width:31px;height:31px}
.elite-orb{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#354763,#161a2b 78%);box-shadow:inset 0 0 0 1px #ffffff1c;overflow:hidden}
.elite-orb .spark-art{width:37px;height:37px;filter:drop-shadow(0 0 6px var(--elite-color))}
.elite-title>div{min-width:0;flex:1}.elite-level{margin-left:auto;flex:0 0 auto;font-size:10px;letter-spacing:.03em;color:#e5e4f6;border:1px solid #6c708a;background:#2b324b;border-radius:8px;padding:6px 8px;font-weight:800}
.elite-timer{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px;color:#92a4c1;font-size:10px;min-height:20px;font-variant-numeric:tabular-nums}
.elite-status{font-weight:850;letter-spacing:.04em;color:#d2c2ec}.elite-status.live{color:#a4f4da}.elite-status.ready{color:#ffe6ac}
.elite-timer-track{height:5px;overflow:hidden;border-radius:10px;background:#0c1325;margin-bottom:12px}
.elite-timer-track>span{display:block;height:100%;border-radius:10px;transition:width .25s linear}
.elite-bottom{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:stretch}.elite-bottom button{width:100%;min-width:0}
.deploy-btn{border-color:var(--elite-color);background:linear-gradient(125deg,#254b52,#34405c)}
.power-chip.limited{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.power-chip .spark-art{width:18px;height:18px;filter:none}
.elite-hud{grid-template-columns:repeat(2,minmax(0,1fr));align-items:center}
.elite-pill{height:36px;gap:5px}
.elite-pill .spark-art{width:21px;height:21px;filter:none}
.elite-pill .elite-charge{flex:0 0 auto;max-width:112px;font-size:9px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.limited-pill{display:inline-flex;align-items:center;gap:5px}
.limited-pill .spark-art{width:20px;height:20px;filter:none}

(()=>{'use strict';

const shardLevelAtStage=stage=>Math.max(1,Math.round(stage<=10?1+(stage-1)/3:4+(stage-10)*.65));

function pickShardLevel(stage,roll=Math.random()){

 if(core===1)return 1;
 if(roll<.64)return core;
 if(roll<.86)return Math.max(1,core-1);

}

// Return the FIRST contact along the moving segment, including a shard edge or wall.

 else if(dx>0&&s.x+dx>right)offer((right-s.x)/dx,-1,0,null);
 if(dy<0&&s.y+dy<top)offer((top-s.y)/dy,0,1,null);
 else if(dy>0&&s.y+dy>bottom)offer((bottom-s.y)/dy,0,-1,null);

 for(const t of shards){
  if(!t.alive||x1>t.maxX||x2<t.minX||y1>t.maxY||y2<t.minY)continue;
  const poly=corners(t);
  for(let j=0;j<poly.length;j++){
   const a=poly[j],b=poly[(j+1)%poly.length],ex=b[0]-a[0],ey=b[1]-a[1];
   const den=dx*ey-dy*ex;

   const time=(qx*ey-qy*ex)/den,edgePart=(qx*dy-qy*dx)/den;

}

  s.x=clamp(s.x,8,W-8);s.y=clamp(s.y,8,H-8);
  s.path.push([s.x,s.y]);if(s.path.length>15)s.path.shift();
  s.spin+=elapsed*3;
  if(s.mini)s.life-=elapsed;
 }
 miniSparks=miniSparks.filter(s=>s.life>0);
 for(const t of shards)if(t.flash>0)t.flash=Math.max(0,t.flash-elapsed);
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*elapsed;p.y+=p.vy*elapsed;p.vx*=.985;p.vy*=.985;p.life-=elapsed;if(p.life<=0)particles.splice(i,1)}
 for(let i=damagePopups.length-1;i>=0;i--){const p=damagePopups[i];p.life-=elapsed;p.y-=20*elapsed;if(p.life<=0)damagePopups.splice(i,1)}
 if(queueStage){queueStage=false;const bonus=Math.floor(16*Math.pow(state.stage,1.42)*fortune());state.cash+=bonus;state.earned+=bonus;state.stage++;createStage();announce('Canvas cleared! +' +fmt(bonus)+' prisms ✧ · Next: Lv '+shardLevelAtStage(state.stage));save()}
 if(state.autoMerge){for(let i=0;i<MAX_TIERS-1;i++)if(state.tiers[i]>=2){state.tiers[i]-=2;state.tiers[i+1]++;syncSparks();renderPanel()}}
 recentTimer+=dt;if(recentTimer>=1){lastDps=recentGains/recentTimer;recentGains=0;recentTimer=0}
}
function draw(){ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#161a31');bg.addColorStop(.55,'#111c2c');bg.addColorStop(1,'#1b1830');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 for(const star of backgroundStars){ctx.globalAlpha=star.a;ctx.fillStyle='#deecff';ctx.beginPath();ctx.arc(star.x,star.y,star.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 for(const t of shards)if(t.alive){
  const poly=corners(t);
  ctx.globalAlpha=t.alpha;ctx.beginPath();ctx.moveTo(poly[0][0],poly[0][1]);
  for(let j=1;j<poly.length;j++)ctx.lineTo(poly[j][0],poly[j][1]);
  ctx.closePath();ctx.fillStyle=t.hue;ctx.fill();
  // Fine uncoloured seams, subtle internal facets: no armour outlines or gaps.
  if(poly.length>=5){ctx.globalAlpha=t.alpha*.10;ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(t.x,t.y);
   ctx.lineTo(poly[1][0],poly[1][1]);ctx.lineTo(poly[2][0],poly[2][1]);ctx.closePath();ctx.fill();}
  ctx.globalAlpha=t.alpha;ctx.beginPath();ctx.moveTo(poly[0][0],poly[0][1]);for(let j=1;j<poly.length;j++)ctx.lineTo(poly[j][0],poly[j][1]);ctx.closePath();ctx.strokeStyle=t.flash>0?'#f3fcff':'#13182f';ctx.lineWidth=1;ctx.stroke();
  if(t.hp<t.maxHp){ctx.globalAlpha=.2;ctx.strokeStyle='#f3fcff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(t.x,t.y);
   const corner=poly[Math.floor(poly.length/2)];ctx.lineTo(corner[0],corner[1]);ctx.stroke();}
 }ctx.globalAlpha=1;
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.maxLife);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 ctx.textAlign='center';ctx.font='700 11px system-ui,sans-serif';for(const p of damagePopups){ctx.globalAlpha=Math.max(0,p.life/p.maxLife)*.9;ctx.fillStyle='#f4fbff';ctx.fillText('−'+p.value,p.x,p.y)}ctx.globalAlpha=1;
 // Crisp vector art, matching the workshop icons. Trails preserve the existing physics.
 for(const s of [...sparks,...specialSparks]){
  const rare=!!s.special,color=rare?LIMITED_DEFS[s.special].color:tierColors[s.tier];
  for(let i=1;i<s.path.length;i++){const a=s.path[i-1],b=s.path[i];ctx.globalAlpha=i/s.path.length*.34;ctx.strokeStyle=color;ctx.lineWidth=1+s.tier*.16;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
  ctx.globalAlpha=1;ctx.save();ctx.translate(s.x,s.y);ctx.shadowBlur=rare?20:14;ctx.shadowColor=color;
  if(rare){ctx.strokeStyle=color;ctx.globalAlpha=.58;ctx.lineWidth=1.25;ctx.beginPath();ctx.arc(0,0,13+Math.sin(gameTime*5+s.spin)*1.4,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
  drawSparkGlyph(rare?'rare':'normal',rare?s.special:s.tier,rare?23:15+s.tier*3.3,Math.atan2(s.vy,s.vx)+Math.PI/2);
  ctx.restore();
 }
 for(const s of eliteSparks){const def=ELITE_DEFS[s.elite];ctx.save();ctx.translate(s.x,s.y);
  ctx.shadowBlur=22;ctx.shadowColor=def.color;ctx.strokeStyle=def.color;ctx.globalAlpha=.55;
  ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(0,0,16.5,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
  drawSparkGlyph('elite',s.elite,32,s.elite==='rotary'?s.spin*1.8:s.elite==='shatter'?s.spin*.3:Math.atan2(s.vy,s.vx));
  ctx.restore();
 }
 for(const s of miniSparks){const def=ELITE_DEFS[s.mini];ctx.globalAlpha=Math.min(1,Math.max(0,s.life/.25));ctx.strokeStyle=def.color;ctx.fillStyle='#fff';ctx.lineWidth=1.3;ctx.shadowBlur=13;ctx.shadowColor=def.color;ctx.beginPath();ctx.moveTo(s.x-s.vx*.027,s.y-s.vy*.027);ctx.lineTo(s.x,s.y);ctx.stroke();ctx.beginPath();ctx.arc(s.x,s.y,s.mini==='rotary'?2.7:3.5,0,Math.PI*2);ctx.fill();}ctx.shadowBlur=0;ctx.globalAlpha=1;
}
function loop(time){if(!lastFrame)lastFrame=time;const dt=clamp((time-lastFrame)/1000,0,.05);lastFrame=time;tick(dt);draw();if(time-lastUI>220){updateLabels();lastUI=time}if(time-lastPanel>650){renderPanel();lastPanel=time}if(time-lastSave>2000){save();lastSave=time}requestAnimationFrame(loop)}
$('panel').addEventListener('pointerdown',()=>{menuPressing=true;menuLastPress=performance.now()});
for(const ev of ['pointerup','pointercancel'])$('panel').addEventListener(ev,()=>{menuPressing=false;menuLastPress=performance.now()});

$('panel').addEventListener('click',e=>{let btn=e.target.closest('button[data-act]');if(!btn)return;let action=btn.dataset.act,i=Number(btn.dataset.tier),id=btn.dataset.id;let ok=false;if(action==='buy'){let c=buyCost(i);if(state.cash>=c&&totalSparks()<MAX_SPARKS){state.cash-=c;state.tiers[i]++;syncSparks();ok=true}}else if(action==='buy-max'){let n=0;while(n<MAX_SPARKS&&totalSparks()<MAX_SPARKS){let c=buyCost(i);if(state.cash<c)break;state.cash-=c;state.tiers[i]++;n++}if(n){syncSparks();ok=true;announce('Added '+n+' '+tierNames[i]+' spark'+(n===1?'':'s'))}}else if(action==='level'){let c=levelCost(i);if(state.tiers[i]>0&&state.cash>=c){state.cash-=c;state.levels[i]++;ok=true}}else if(action==='merge'){if(i<MAX_TIERS-1&&state.tiers[i]>=2){state.tiers[i]-=2;state.tiers[i+1]++;syncSparks();announce(tierNames[i+1]+' unlocked ✨');ok=true}}else if(action==='upgrade'){let c=upgradeCost(id);if(c&&state.cash>=c){state.cash-=c;state.upgrades[id]++;ok=true}}else if(action==='auto'){if(!state.autoMerge&&state.cash>=3500){state.cash-=3500;state.autoMerge=true;ok=true;announce('Auto Merge unlocked')}}else if(action==='unlock-power'){
 const def=POWER_DEFS[id],p=state.powers[id];if(def&&p&&p.level===0&&state.cash>=def.unlock){state.cash-=def.unlock;p.level=1;ok=true;announce(def.name+' unlocked!')}}else if(action==='upgrade-power'){
 const p=state.powers[id];if(POWER_DEFS[id]&&p&&p.level>=1&&p.level<5){let c=powerUpgradeCost(id);if(state.cash>=c){state.cash-=c;p.level++;ok=true;announce(POWER_DEFS[id].name+' Lv '+p.level)}}}else if(action==='activate-power'){
 if(activatePower(id))ok=true;
 }else if(action==='buy-elite'){
 const def=ELITE_DEFS[id];if(def&&state.elites[id]===0&&state.cash>=def.cost){state.cash-=def.cost;state.elites[id]=1;deployElite(id);ok=true;announce(def.name+' unlocked and deployed! ✨')}
 }else if(action==='upgrade-elite'){
 if(ELITE_DEFS[id]&&state.elites[id]>=1&&state.elites[id]<MAX_ELITE_LEVEL){const c=eliteUpgradeCost(id);if(state.cash>=c){state.cash-=c;state.elites[id]++;ok=true;announce(ELITE_DEFS[id].name+' level '+state.elites[id])}}
 }else if(action==='deploy-elite'){
 if(deployElite(id))ok=true;
 }else if(action==='ascend'){let gain=Math.floor(Math.sqrt(Math.max(0,state.earned)/17000));if(state.stage>=5&&gain>0&&confirm('Ascend for +'+gain+' permanent auras? Your canvases, sparks and temporary upgrades will reset.')){let next=fresh();next.auras=state.auras+gain;next.ascensions=state.ascensions+1;next.autoMerge=state.autoMerge;next.muted=state.muted;next.elites={...state.elites};next.eliteTimers=Object.fromEntries(Object.entries(state.eliteTimers).map(([id,t])=>[id,{...t}]));
 // Power unlocks and their levels are permanent; clear active effects on prestige.
 next.powers=Object.fromEntries(Object.entries(state.powers).map(([id,p])=>[id,{level:p.level,activeUntil:0,cooldownUntil:p.cooldownUntil}]));
 state=next;sparks=[];specialSparks=state.specialSparks;miniSparks=[];syncSparks();syncEliteSparks();createStage();ok=true;announce('A new dawn! +'+gain+' auras')}}if(ok){save();menuLastPress=-1000;renderPanel();updateLabels()}});

syncSparks();syncEliteSparks();resize();renderPanel();updateLabels();if('ResizeObserver'in window)new ResizeObserver(resize).observe(canvas);window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else lastFrame=0});window.addEventListener('pagehide',save);requestAnimationFrame(loop);
